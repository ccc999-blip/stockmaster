    function setColorMode(mode) {
      appState.settings.colorMode = mode;
      applyColorTheme();
      updateColorModeButtons();
      saveState();
      setOrderSide(orderSide);
      renderSimTab();
      if (appState.activeTab === 'chart') {
        updateChartHeader();
        renderActiveChart();
      }
    }

    function updateColorModeButtons() {
      const isTW = appState.settings.colorMode === 'TW';
      document.getElementById('setColorTW').className = isTW
        ? 'btn-term py-2 border border-[#FF9900] bg-[rgba(255,153,0,0.14)] text-[#FF9900] font-bold'
        : 'btn-term py-2 border border-[#262E3D] bg-[#0A0C0F] text-[#8B95A5] font-semibold';
      document.getElementById('setColorUS').className = !isTW
        ? 'btn-term py-2 border border-[#FF9900] bg-[rgba(255,153,0,0.14)] text-[#FF9900] font-bold'
        : 'btn-term py-2 border border-[#262E3D] bg-[#0A0C0F] text-[#8B95A5] font-semibold';
    }

    function renderSettingsWatchlist() {
      const el = document.getElementById('settingsWatchlist');
      el.innerHTML = appState.settings.watchlist.map(sym => `
        <span class="inline-flex items-center gap-1.5 px-2 py-1 bg-[#0A0C0F] border border-[#262E3D] rounded-[2px] text-[12px] mono">
          ${escapeHtml(sym)}
          <button onclick="removeWatchlistSymbol('${escapeHtml(sym)}')" class="text-[#FF3B30] font-bold px-0.5">✕</button>
        </span>
      `).join('');
    }

    function addWatchlistSymbol() {
      const input = document.getElementById('newWatchSymbol');
      const sym = normalizeSymbol(input.value);
      if (!sym) return;
      if (!appState.settings.watchlist.includes(sym)) {
        appState.settings.watchlist.push(sym);
        saveState();
        renderSettingsWatchlist();
        renderWatchlistChips();
      }
      input.value = '';
    }

    function removeWatchlistSymbol(sym) {
      if (appState.settings.watchlist.length <= 1) {
        showToast('自選股至少需保留 1 檔標的', 'warn');
        return;
      }
      appState.settings.watchlist = appState.settings.watchlist.filter(s => s !== sym);
      saveState();
      renderSettingsWatchlist();
      renderWatchlistChips();
    }

    function saveSettingsFromModal() {
      const feeRate = Number(document.getElementById('setFeeRate').value);
      const discount = Number(document.getElementById('setDiscount').value);
      const minFee = Number(document.getElementById('setMinFee').value);
      const stockTax = Number(document.getElementById('setStockTax').value);
      const etfTax = Number(document.getElementById('setEtfTax').value);
      const ma0 = Math.max(2, Math.min(240, Math.round(Number(document.getElementById('setMa0').value) || 5)));
      const ma1 = Math.max(2, Math.min(240, Math.round(Number(document.getElementById('setMa1').value) || 20)));
      const ma2 = Math.max(2, Math.min(240, Math.round(Number(document.getElementById('setMa2').value) || 60)));
      const cacheTtlMs = Number(document.getElementById('setCacheTtl').value);

      if (feeRate < 0 || discount < 0 || minFee < 0 || stockTax < 0 || etfTax < 0) {
        showToast('費率與折數不可為負數', 'error');
        return;
      }

      appState.settings.feeRate = feeRate;
      appState.settings.discount = discount;
      appState.settings.minFee = minFee;
      appState.settings.stockTaxRate = stockTax;
      appState.settings.etfTaxRate = etfTax;
      appState.settings.maPeriods = [ma0, ma1, ma2];
      appState.settings.cacheTtlMs = cacheTtlMs;

      saveState();
      closeModal('settingsModal');
      renderSimTab();
      updateOrderPreview();
      updateChartControlsUI();
      if (appState.activeTab === 'chart') renderActiveChart();
      showToast('終端機設定已儲存並套用', 'success');
    }

    function exportJsonBackup() {
      const payload = {
        ...appState,
        marketCache: {},
        exportedAt: new Date().toISOString()
      };
      const jsonStr = JSON.stringify(payload, null, 2);

      try {
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `bbg_sim_backup_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (_) {}

      closeModal('settingsModal');
      document.getElementById('exportModalTitle').textContent = '系統資料備份 (JSON)';
      document.getElementById('exportTextarea').value = jsonStr;
      openModal('exportModal');
      copyTextFallback(jsonStr);
      showToast('已產生 JSON 備份檔並複製內容', 'success');
    }

    function validateAndRestoreJson(rawText) {
      try {
        const parsed = JSON.parse(rawText);
        if (!parsed || typeof parsed !== 'object') throw new Error('JSON 結構無效');
        if (!Array.isArray(parsed.accounts) || parsed.accounts.length === 0) {
          throw new Error('缺少有效的 accounts 帳戶陣列');
        }
        for (const a of parsed.accounts) {
          if (!a.id || typeof a.cash !== 'number' || typeof a.holdings !== 'object') {
            throw new Error('帳戶資料欄位損毀');
          }
        }
        const def = createDefaultState();
        const accounts = parsed.accounts.map(a => ({
          ...a,
          totalDeposited: typeof a.totalDeposited === 'number' ? a.totalDeposited : 0
        }));
        appState = {
          ...def,
          ...parsed,
          accounts,
          settings: { ...def.settings, ...(parsed.settings || {}) },
          marketCache: appState.marketCache || {}
        };
        saveState();
        applyColorTheme();
        closeModal('settingsModal');
        switchMainTab(appState.activeTab || 'sim');
        showToast('JSON 備份已通過驗證並成功還原', 'success');
      } catch (e) {
        showToast('還原失敗（格式驗證未過）：' + e.message, 'error');
      }
    }

    function handleImportJsonFile(ev) {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => validateAndRestoreJson(String(reader.result || ''));
      reader.readAsText(file);
      ev.target.value = '';
    }

    function importJsonFromTextarea() {
      const raw = document.getElementById('importJsonText').value.trim();
      if (!raw) {
        showToast('請先貼上 JSON 備份內容', 'error');
        return;
      }
      validateAndRestoreJson(raw);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* ========================================================================
       8. 系統啟動初始化 (BOOT)
       ======================================================================== */
    function updateClock() {
      const now = new Date();
      document.getElementById('headerClock').textContent =
        now.toLocaleDateString('zh-TW') + ' ' + now.toTimeString().slice(0, 8);
    }

    window.addEventListener('DOMContentLoaded', () => {
      applyColorTheme();
      updateClock();
      setInterval(updateClock, 1000);

      setOrderSide('BUY');
      setOrderUnitMode('LOT');
      document.getElementById('orderSymbol').value = '2330.TW';

      switchMainTab(appState.activeTab || 'sim');

      getMarketData('2330.TW', false).then(data => {
        if (!document.getElementById('orderPrice').value) {
          document.getElementById('orderPrice').value = data.price;
          document.getElementById('orderQuoteName').textContent = `${data.symbol} ${data.name}`;
          updateOrderPreview();
        }
        renderSimTab();
      }).catch(() => {});
    });
  </script>
</body>
</html>
