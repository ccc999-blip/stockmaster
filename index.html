<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- iOS Safari Web App 全螢幕設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="股市策略實驗室">
  <meta name="theme-color" content="#000000">
  <title>股市策略實驗室</title>

  <!-- 載入 Tailwind CSS 與等寬/繁中字體 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- 載入 TradingView Lightweight Charts v4.1.3 (含內建 Canvas 2D 離線降級機制) -->
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    /* ==========================================================================
       華爾街專業終端機風 (Bloomberg Terminal Style) 核心視覺變數與樣式
       ========================================================================== */
    :root {
      --bg-root: #000000;
      --bg-app: #0A0C0F;
      --bg-card: #11151C;
      --bg-elevated: #171D26;
      --border-sharp: #262E3D;
      --border-focus: #FF9900;
      --accent: #FF9900;
      --accent-dim: rgba(255, 153, 0, 0.16);
      --text-primary: #F3F4F6;
      --text-secondary: #8B95A5;
      /* 預設台股模式：紅漲綠跌 */
      --up-color: #FF3B30;
      --up-bg: rgba(255, 59, 48, 0.14);
      --down-color: #00C853;
      --down-bg: rgba(0, 200, 83, 0.14);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* 美股模式：綠漲紅跌 */
    body.theme-us {
      --up-color: #00C853;
      --up-bg: rgba(0, 200, 83, 0.14);
      --down-color: #FF3B30;
      --down-bg: rgba(255, 59, 48, 0.14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-root);
      color: var(--text-primary);
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
    }

    /* 等寬數字對齊：確保價格與損益跳動時不抖動 */
    .mono {
      font-family: 'JetBrains Mono', 'SF Mono', Consolas, Monaco, monospace !important;
      font-variant-numeric: tabular-nums !important;
    }

    /* 終端機銳利卡片 */
    .term-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-sharp);
      border-radius: 3px;
    }

    /* 強制所有輸入控制項 >= 16px，避免 iOS Safari 點擊時自動縮放 */
    input, select, textarea {
      font-size: 16px !important;
      background-color: #090C10;
      color: var(--text-primary);
      border: 1px solid var(--border-sharp);
      border-radius: 3px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    /* 漲跌文字與背景輔助類 */
    .txt-up { color: var(--up-color); }
    .txt-down { color: var(--down-color); }
    .bg-up-soft { background-color: var(--up-bg); color: var(--up-color); border: 1px solid var(--up-color); }
    .bg-down-soft { background-color: var(--down-bg); color: var(--down-color); border: 1px solid var(--down-color); }

    /* 頂部固定狀態列 (含 iOS 安全邊距) */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: rgba(10, 12, 15, 0.96);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-sharp);
      padding-top: var(--safe-top);
    }

    /* 底部固定雙分頁導覽列 (含 iOS 安全邊距) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background-color: rgba(10, 12, 15, 0.98);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-sharp);
      padding-bottom: var(--safe-bottom);
    }

    /* 主內容區預留底部導覽列高度 */
    .main-container {
      padding-bottom: calc(74px + var(--safe-bottom));
      min-height: 100vh;
      background-color: var(--bg-app);
    }

    /* 自訂捲軸 (終端機極細風格) */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 狀態燈號動畫 */
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .dot-live {
      animation: pulseDot 2s infinite;
    }

    /* Modal 遮罩 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background-color: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 640px) {
      .modal-backdrop {
        align-items: center;
        padding: 16px;
      }
    }
    .modal-panel {
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      background-color: #11151C;
      border: 1px solid #364154;
      border-radius: 4px 4px 0 0;
      display: flex;
      flex-direction: column;
      padding-bottom: var(--safe-bottom);
    }
    @media (min-width: 640px) {
      .modal-panel {
        border-radius: 4px;
        padding-bottom: 0;
      }
    }

    /* 按鈕點擊反饋 */
    .btn-term {
      border-radius: 3px;
      transition: background-color 0.12s ease, opacity 0.12s ease, transform 0.08s ease, border-color 0.12s ease;
      user-select: none;
    }
    .btn-term:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    /* 總資產可點擊充值卡片 */
    .deposit-card {
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.08s ease;
    }
    .deposit-card:hover {
      border-color: #FF9900;
      background-color: #121720;
    }
    .deposit-card:active {
      transform: scale(0.985);
      border-color: #FF9900;
      background-color: #161C27;
    }
  </style>
</head>
<body>
  <!-- ========================================================================
       頂部終端機狀態列 (HEADER)
       ======================================================================== -->
  <header class="top-bar">
    <div class="max-w-4xl mx-auto px-3 h-12 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <button onclick="openAccountSwitchModal()" title="切換帳戶" aria-label="切換帳戶"
          class="btn-term cursor-pointer px-1.5 py-0.5 text-[11px] font-bold tracking-wider bg-[#FF9900] text-black rounded-[2px] mono shrink-0 hover:brightness-110 active:scale-95">BBG</button>
        <div class="truncate">
          <div class="text-[13px] font-bold tracking-wide text-[#F3F4F6] leading-tight truncate">股市策略實驗室</div>
          <div id="headerClock" class="text-[10px] text-[#8B95A5] mono leading-tight">--:--:--</div>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <!-- 行情連線狀態燈號（顯示資料來源：LIVE · FINMIND / YAHOO / STOOQ / CACHED / OFFLINE SIM） -->
        <button id="statusBadgeBtn" onclick="forceRefreshCurrentContext()" title="點擊強制重新連網抓取最新行情"
          class="flex items-center gap-1.5 px-2 py-1 text-[11px] font-semibold mono border border-[#262E3D] bg-[#11151C] rounded-[2px] active:bg-[#1E2634]">
          <span id="statusDot" class="w-2 h-2 rounded-full bg-[#FF9900]"></span>
          <span id="statusText" class="text-[#FF9900]">INIT</span>
        </button>

        <!-- 右上角齒輪設定按鈕 -->
        <button onclick="openSettingsModal()" aria-label="設定" title="設定"
          class="btn-term w-8 h-8 flex items-center justify-center border border-[#364154] bg-[#171D26] text-[#F3F4F6] hover:border-[#FF9900] hover:text-[#FF9900]">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ========================================================================
       主內容區 (MAIN)
       ======================================================================== -->
  <main class="main-container">
    <div class="max-w-4xl mx-auto px-3 py-3">

      <!-- ====================================================================
           分頁一：模擬股票 (多帳戶策略實驗室)
           ==================================================================== -->
      <section id="tab-sim" class="space-y-3">
        <!-- 1. 多帳戶管理列 -->
        <div class="term-card p-3 space-y-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[12px] font-bold tracking-wider text-[#FF9900] whitespace-nowrap">多帳戶管理</span>
            <div class="flex items-center gap-1.5 shrink-0">
              <button onclick="openAccountModal('create')" title="新增帳戶" aria-label="新增帳戶"
                class="btn-term w-7 h-7 flex items-center justify-center text-[15px] font-bold bg-[#FF9900] text-black whitespace-nowrap shrink-0">+</button>
              <button onclick="openAccountModal('edit')" title="編輯帳戶" aria-label="編輯帳戶"
                class="btn-term w-7 h-7 flex items-center justify-center text-[13px] font-semibold border border-[#262E3D] bg-[#171D26] text-[#F3F4F6] whitespace-nowrap shrink-0">✎</button>
              <button onclick="confirmResetAccount()" title="重置帳戶" aria-label="重置帳戶"
                class="btn-term w-7 h-7 flex items-center justify-center text-[14px] font-semibold border border-[#262E3D] bg-[#171D26] text-[#FF9900] whitespace-nowrap shrink-0">↺</button>
              <button onclick="confirmDeleteAccount()" title="刪除帳戶" aria-label="刪除帳戶"
                class="btn-term w-7 h-7 flex items-center justify-center text-[13px] font-semibold border border-[#262E3D] bg-[#171D26] text-[#FF3B30] whitespace-nowrap shrink-0">✕</button>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row sm:items-center gap-2">
            <div onclick="openAccountSwitchModal()" title="點擊切換其他帳戶"
              id="accountDisplayName" class="cursor-pointer w-full sm:w-64 px-2.5 py-2 text-[15px] font-semibold bg-[#0A0C0F] border border-[#262E3D] hover:border-[#FF9900] rounded-[3px] text-[#F3F4F6] truncate select-none"></div>
            <div id="accountStrategyTag" class="hidden text-[12px] text-[#8B95A5] bg-[#0A0C0F] border border-[#262E3D] px-2.5 py-1.5 rounded-[2px] flex-1 truncate"></div>
          </div>
        </div>

        <!-- 2. 資產總覽儀表板 -->
        <div class="term-card p-3 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-[12px] font-bold tracking-wider text-[#8B95A5]">資產總覽</span>
            <button onclick="refreshAccountHoldingsPrices()" class="btn-term text-[11px] mono text-[#FF9900] border border-[#262E3D] px-2 py-0.5 bg-[#0A0C0F]">
              ↻ 更新現價
            </button>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <!-- 總資產卡片：點擊開啟帳戶充值 -->
            <div onclick="openDepositModal()" role="button" tabindex="0" title="點擊為目前帳戶充值"
              class="deposit-card bg-[#0A0C0F] border border-[#262E3D] p-2.5 rounded-[2px] relative">
              <div class="flex items-center justify-between gap-1">
                <span class="text-[11px] text-[#8B95A5]">總資產</span>
                <span class="text-[10px] font-semibold text-[#FF9900] bg-[rgba(255,153,0,0.14)] border border-[rgba(255,153,0,0.4)] px-1.5 py-0.2 rounded-[2px] whitespace-nowrap">+ 充值</span>
              </div>
              <div id="ovTotalAssets" class="text-[17px] font-bold mono mt-0.5 text-[#F3F4F6]">0</div>
              <div id="ovTotalRoi" class="text-[11px] mono mt-0.5 text-[#8B95A5]">總報酬 0.00%</div>
            </div>
            <div class="bg-[#0A0C0F] border border-[#262E3D] p-2.5 rounded-[2px]">
              <div class="text-[11px] text-[#8B95A5]">可用現金</div>
              <div id="ovCash" class="text-[17px] font-bold mono mt-0.5 text-[#F3F4F6]">0</div>
              <div id="ovInitial" class="text-[11px] mono mt-0.5 text-[#8B95A5]">本金 0</div>
            </div>
            <div class="bg-[#0A0C0F] border border-[#262E3D] p-2.5 rounded-[2px]">
              <div class="text-[11px] text-[#8B95A5]">未實現損益</div>
              <div id="ovUnrealized" class="text-[17px] font-bold mono mt-0.5">0</div>
              <div id="ovUnrealizedPct" class="text-[11px] mono mt-0.5">0.00%</div>
            </div>
            <div class="bg-[#0A0C0F] border border-[#262E3D] p-2.5 rounded-[2px]">
              <div class="text-[11px] text-[#8B95A5]">累計已實現損益</div>
              <div id="ovRealized" class="text-[17px] font-bold mono mt-0.5">0</div>
              <div id="ovHoldingsVal" class="text-[11px] mono mt-0.5 text-[#8B95A5]">持股現值 0</div>
            </div>
          </div>

          <!-- 一鍵匯出 AI 檢討報告按鈕 -->
          <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="exportReport('current')"
              class="btn-term py-2 px-2 text-[12px] font-semibold border border-[#FF9900] text-[#FF9900] bg-[rgba(255,153,0,0.08)]">
              匯出此帳戶分析文字
            </button>
            <button onclick="exportReport('all')"
              class="btn-term py-2 px-2 text-[12px] font-semibold border border-[#364154] text-[#F3F4F6] bg-[#171D26]">
              匯出全部帳戶分析文字
            </button>
          </div>
        </div>

        <!-- 3. 擬真下單面板 -->
        <div class="term-card p-3 space-y-3">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[12px] font-bold tracking-wider text-[#FF9900] whitespace-nowrap">擬真下單面板</span>
            <span id="orderQuoteName" class="text-[11px] text-[#8B95A5] truncate max-w-[210px]">尚未查詢標的</span>
          </div>

          <!-- 標的代號與報價查詢 -->
          <div class="flex gap-2">
            <input id="orderSymbol" type="text" placeholder="輸入代號如 2330 或 NVDA" autocomplete="off"
              class="flex-1 px-2.5 py-2 mono uppercase" onkeydown="if(event.key==='Enter') fetchOrderQuote()">
            <button id="btnQueryQuote" onclick="fetchOrderQuote()"
              class="btn-term px-3.5 py-2 text-[13px] font-bold bg-[#FF9900] text-black shrink-0">
              查詢報價
            </button>
          </div>

          <!-- 買賣方向切換 -->
          <div class="grid grid-cols-2 gap-2">
            <button id="btnSideBuy" onclick="setOrderSide('BUY')"
              class="btn-term py-2 text-[13px] font-bold border">
              買進
            </button>
            <button id="btnSideSell" onclick="setOrderSide('SELL')"
              class="btn-term py-2 text-[13px] font-bold border">
              賣出
            </button>
          </div>

          <!-- 交易單位模式與 ETF 稅率 -->
          <div class="flex flex-wrap items-center justify-between gap-2 bg-[#0A0C0F] border border-[#262E3D] px-2.5 py-2 rounded-[2px]">
            <div class="flex items-center gap-2">
              <button id="btnUnitLot" onclick="setOrderUnitMode('LOT')"
                class="btn-term px-2.5 py-1 text-[12px] font-semibold border whitespace-nowrap">
                整股 (1000股/張)
              </button>
              <button id="btnUnitOdd" onclick="setOrderUnitMode('ODD')"
                class="btn-term px-2.5 py-1 text-[12px] font-semibold border whitespace-nowrap">
                零股 (1~999股)
              </button>
            </div>
            <label class="flex items-center gap-1.5 text-[12px] text-[#F3F4F6] cursor-pointer select-none">
              <input id="orderIsEtf" type="checkbox" onchange="updateOrderPreview()">
              <span>ETF 稅率 (<span id="etfTaxLabel" class="mono">0.1%</span>)</span>
            </label>
          </div>

          <!-- 價格與數量輸入 -->
          <div class="grid grid-cols-2 gap-2 items-end">
            <div>
              <label class="block text-[11px] text-[#8B95A5] mb-1 whitespace-nowrap">委託/成交單價</label>
              <input id="orderPrice" type="number" step="any" min="0" placeholder=""
                oninput="updateOrderPreview()" class="w-full px-2.5 py-2 mono">
            </div>
            <div>
              <label id="orderQtyLabel" class="block text-[11px] text-[#8B95A5] mb-1 whitespace-nowrap">數量（張）</label>
              <input id="orderQty" type="number" step="any" min="0" placeholder=""
                oninput="updateOrderPreview()" class="w-full px-2.5 py-2 mono">
            </div>
          </div>

          <!-- 交易理由與筆記 -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] text-[#8B95A5] mb-1">交易理由</label>
              <select id="orderReason" class="w-full px-2.5 py-2">
                <option value="">（不填寫）</option>
                <option value="突破均線">突破均線</option>
                <option value="回測支撐">回測支撐</option>
                <option value="基本面/題材">基本面/題材</option>
                <option value="ETF定期定額">ETF定期定額</option>
                <option value="策略測試">策略測試</option>
                <option value="情緒/試單">情緒/試單</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] text-[#8B95A5] mb-1">操作筆記 / 停損停利計畫</label>
              <input id="orderNote" type="text" placeholder="" class="w-full px-2.5 py-2">
            </div>
          </div>

          <!-- 即時成本與稅費試算表 -->
          <div class="bg-[#0A0C0F] border border-[#262E3D] p-2.5 rounded-[2px] text-[12px] space-y-1 mono">
            <div class="flex justify-between">
              <span class="text-[#8B95A5]">換算股數 / 成交金額</span>
              <span id="prevGross" class="text-[#F3F4F6]">0 股 / $0</span>
            </div>
            <div class="flex justify-between">
              <span class="text-[#8B95A5]">預估手續費 / 證交稅</span>
              <span id="prevFeeTax" class="text-[#F3F4F6]">費 $0 / 稅 $0</span>
            </div>
            <div class="flex justify-between border-t border-[#262E3D] pt-1 font-bold">
              <span id="prevNetLabel" class="text-[#FF9900]">預計扣款總額</span>
              <span id="prevNetAmount" class="text-[#FF9900]">$0</span>
            </div>
            <div id="orderValidationMsg" class="hidden text-[11px] text-[#FF3B30] pt-1 font-sans"></div>
          </div>

          <!-- 確認下單按鈕 -->
          <button id="btnSubmitOrder" onclick="submitOrder()"
            class="btn-term w-full py-2.5 text-[14px] font-bold tracking-wider bg-[#FF9900] text-black">
            買進
          </button>
        </div>

        <!-- 4. 目前持股清單 -->
        <div class="term-card p-3 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-[12px] font-bold tracking-wider text-[#8B95A5]">目前持股</span>

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createDefaultState();
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.accounts) || parsed.accounts.length === 0) {
          return createDefaultState();
        }
        const def = createDefaultState();
        const accounts = parsed.accounts.map(a => ({
          ...a,
          totalDeposited: typeof a.totalDeposited === 'number' ? a.totalDeposited : 0
        }));
        return {
          ...def,
          ...parsed,
          accounts,
          settings: { ...def.settings, ...(parsed.settings || {}) },
          marketCache: parsed.marketCache || {}
        };
      } catch (e) {
        return createDefaultState();
      }
    }

    function saveState() {
      try {
        const keys = Object.keys(appState.marketCache || {});
        if (keys.length > 16) {
          keys.sort((a, b) => (appState.marketCache[a].fetchedAt || 0) - (appState.marketCache[b].fetchedAt || 0));
          for (let i = 0; i < keys.length - 16; i++) {
            delete appState.marketCache[keys[i]];
          }
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        showToast('本機儲存空間不足，已自動清理舊行情快取', 'warn');
        appState.marketCache = {};
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); } catch (_) {}
      }
    }

    function fmtMoney(n, decimals = 0) {
      if (!Number.isFinite(n)) return '0';
      return n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }

    function fmtPrice(n) {
      if (!Number.isFinite(n)) return '--';
      return n >= 1000 ? n.toFixed(1) : n.toFixed(2);
    }

    function fmtSignedMoney(n, decimals = 0) {
      if (!Number.isFinite(n)) return '0';
      const prefix = n > 0 ? '+' : '';
      return prefix + fmtMoney(n, decimals);
    }

    function fmtSignedPct(n) {
      if (!Number.isFinite(n)) return '0.00%';
      const prefix = n > 0 ? '+' : '';
      return prefix + n.toFixed(2) + '%';
    }

    /* ========================================================================
       4. 多層次免代理 + 多代理備援行情引擎 (FinMind + TWSE/TPEx + Yahoo + Stooq)
       ======================================================================== */
    function normalizeSymbol(rawInput) {
      const clean = String(rawInput || '').trim().toUpperCase();
      if (!clean) return '';
      // 台股純數字或 ETF 代號（如 2330, 0050, 00830, 00878, 00631L）自動補上 .TW
      if (/^\d{4,6}[A-Z]?$/.test(clean)) {
        return clean + '.TW';
      }
      return clean;
    }

    function isTaiwanSymbol(sym) {
      return /\.(TW|TWO)$/i.test(sym) || /^\d{4,6}[A-Z]?$/i.test(sym);
    }

    function extractTaiwanCode(sym) {
      return String(sym || '').replace(/\.(TW|TWO)$/i, '').toUpperCase();
    }

    function isLikelyEtf(symbol) {
      return /^00\d{2,4}/.test(String(symbol || '').trim());
    }

    function mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return Math.abs(h);
    }

    /**
     * 第三層降級：僅在完全無網路且無快取時啟用的確定性模擬數據
     */
    function generateOfflineDataset(symbol) {
      const meta = BUILTIN_STOCK_META[symbol] || {
        name: `${symbol} (離線模擬)`,
        base: 50 + (hashString(symbol) % 350),
        vol: 5000000 + (hashString(symbol) % 25000000),
        drift: 0.0005,
        sigma: 0.021,
        seed: hashString(symbol)
      };

      const rand = mulberry32(meta.seed);
      const bars = [];
      let price = meta.base * 0.86;
      const totalDays = 140;

      const dates = [];
      const cur = new Date();
      while (dates.length < totalDays) {
        const day = cur.getDay();
        if (day !== 0 && day !== 6) {
          const y = cur.getFullYear();
          const m = String(cur.getMonth() + 1).padStart(2, '0');
          const d = String(cur.getDate()).padStart(2, '0');
          dates.unshift(`${y}-${m}-${d}`);
        }
        cur.setDate(cur.getDate() - 1);
      }

      for (let i = 0; i < dates.length; i++) {
        const wave = Math.sin(i / 14) * 0.004 + Math.cos(i / 31) * 0.002;
        const z = (rand() + rand() + rand() - 1.5) * 1.6;
        const ret = meta.drift + wave + z * meta.sigma;

        const open = price * (1 + (rand() - 0.5) * 0.008);
        const close = Math.max(1, open * (1 + ret));
        const high = Math.max(open, close) * (1 + rand() * meta.sigma * 0.75);
        const low = Math.max(0.5, Math.min(open, close) * (1 - rand() * meta.sigma * 0.75));
        const volFactor = 0.65 + Math.abs(ret) * 28 + rand() * 0.7;
        const volume = Math.round(meta.vol * volFactor);

        bars.push({
          time: dates[i],
          open: Number(open.toFixed(2)),
          high: Number(high.toFixed(2)),
          low: Number(low.toFixed(2)),
          close: Number(close.toFixed(2)),
          volume
        });
        price = close;
      }

      const last = bars[bars.length - 1];
      const prev = bars[bars.length - 2] || last;
      return {
        symbol,
        name: meta.name,
        price: last.close,
        prevClose: prev.close,
        bars,
        fetchedAt: Date.now(),
        source: 'OFFLINE',
        sourceLabel: 'OFFLINE SIM'
      };
    }

    async function fetchJsonWithTimeout(url, timeoutMs = 6000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { signal: controller.signal });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      } finally {
        clearTimeout(timer);
      }
    }

    async function fetchTextWithTimeout(url, timeoutMs = 6000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { signal: controller.signal });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.text();
      } finally {
        clearTimeout(timer);
      }
    }

    /**
     * 透過 FinMind TaiwanStockInfo 取得真實中文股票名稱與上市/上櫃市場別（並快取於 localStorage）
     */
    async function fetchTaiwanStockMetaDirect(stockCode) {
      const cache = getTwStockInfoCache();
      if (cache[stockCode] && cache[stockCode].name) {
        return cache[stockCode];
      }
      try {
        const url = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo&data_id=${encodeURIComponent(stockCode)}`;
        const json = await fetchJsonWithTimeout(url, 4500);
        if (json && Array.isArray(json.data) && json.data.length > 0) {
          const item = json.data.find(d => d.stock_id === stockCode) || json.data[0];
          const info = {
            name: item.stock_name || stockCode,
            market: item.type === 'tpex' ? 'TWO' : 'TW'
          };
          cache[stockCode] = info;
          saveTwStockInfoCache(cache);
          return info;
        }
      } catch (_) {}
      return { name: stockCode, market: 'TW' };
    }

    /**
     * 將民國年日期 (如 "1151124" 或 "115/11/24") 轉為 YYYY-MM-DD
     */
    function parseRocDateToIso(rocStr) {
      const digits = String(rocStr || '').replace(/\D/g, '');
      if (digits.length === 7) {
        const y = parseInt(digits.slice(0, 3), 10) + 1911;
        const m = digits.slice(3, 5);
        const d = digits.slice(5, 7);
        if (y > 2000 && Number(m) >= 1 && Number(m) <= 12 && Number(d) >= 1 && Number(d) <= 31) {
          return `${y}-${m}-${d}`;
        }
      }
      return null;
    }

    /**
     * 輔助抓取 TWSE 證交所 / TPEx 櫃買中心 OpenAPI 最新交易日收盤與即時報價（免代理 CORS 直連）
     */
    async function fetchTwseOrTpexLatestQuote(stockCode) {
      // 1. 嘗試 TWSE 上市每日收盤行情 OpenAPI
      try {
        const twseList = await fetchJsonWithTimeout('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL', 5000);
        if (Array.isArray(twseList)) {
          const found = twseList.find(row => String(row.Code || '').trim() === stockCode);
          if (found) {
            const close = parseFloat(String(found.ClosingPrice || '').replace(/,/g, ''));
            const open = parseFloat(String(found.OpeningPrice || '').replace(/,/g, '')) || close;
            const high = parseFloat(String(found.HighestPrice || '').replace(/,/g, '')) || close;
            const low = parseFloat(String(found.LowestPrice || '').replace(/,/g, '')) || close;
            const volume = parseInt(String(found.TradeVolume || '0').replace(/,/g, ''), 10) || 0;
            const isoDate = parseRocDateToIso(found.Date);
            if (Number.isFinite(close) && close > 0) {
              return {
                name: String(found.Name || '').trim() || stockCode,
                market: 'TW',
                date: isoDate,
                open, high, low, close, volume,
                apiSource: 'TWSE'
              };
            }
          }
        }
      } catch (_) {}

      // 2. 嘗試 TPEx 上櫃每日收盤行情 OpenAPI
      try {
        const tpexList = await fetchJsonWithTimeout('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes', 5000);
        if (Array.isArray(tpexList)) {
          const found = tpexList.find(row => String(row.SecuritiesCompanyCode || '').trim() === stockCode);
          if (found) {
            const close = parseFloat(String(found.Close || '').replace(/,/g, ''));
            const open = parseFloat(String(found.Open || '').replace(/,/g, '')) || close;
            const high = parseFloat(String(found.High || '').replace(/,/g, '')) || close;
            const low = parseFloat(String(found.Low || '').replace(/,/g, '')) || close;
            const volume = parseInt(String(found.TradingShares || '0').replace(/,/g, ''), 10) || 0;
            const isoDate = parseRocDateToIso(found.Date);
            if (Number.isFinite(close) && close > 0) {
              return {
                name: String(found.CompanyName || '').trim() || stockCode,
                market: 'TWO',
                date: isoDate,
                open, high, low, close, volume,
                apiSource: 'TPEX'
              };
            }
          }
        }
      } catch (_) {}

      return null;
    }

    /**
     * 台股第一層主力：直接透過瀏覽器 CORS 連線 FinMind Open Data + TWSE/TPEx OpenAPI
     */
    async function fetchTaiwanStockDirect(normalizedSym) {
      const stockCode = extractTaiwanCode(normalizedSym);
      const startDt = new Date();
      startDt.setDate(startDt.getDate() - 380);
      const startDateStr = `${startDt.getFullYear()}-${String(startDt.getMonth() + 1).padStart(2, '0')}-${String(startDt.getDate()).padStart(2, '0')}`;

      const priceUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${encodeURIComponent(stockCode)}&start_date=${startDateStr}`;

      // 並行發起 FinMind 歷史 K 線、FinMind 中文名稱、以及 TWSE/TPEx 最新報價
      const [priceRes, metaRes, latestQuote] = await Promise.allSettled([
        fetchJsonWithTimeout(priceUrl, 6500),
        fetchTaiwanStockMetaDirect(stockCode),
        fetchTwseOrTpexLatestQuote(stockCode)
      ]);

      const barsMap = new Map();
      let sourceLabel = 'FINMIND';

      if (priceRes.status === 'fulfilled' && priceRes.value && Array.isArray(priceRes.value.data)) {
        for (const row of priceRes.value.data) {
          const c = Number(row.close);
          const o = Number(row.open) || c;
          const h = Number(row.max) || Math.max(o, c);
          const l = Number(row.min) || Math.min(o, c);
          const v = Math.max(0, Math.round(Number(row.Trading_Volume) || 0));
          if (!row.date || !Number.isFinite(c) || c <= 0) continue;
          barsMap.set(row.date, {
            time: row.date,
            open: Number(o.toFixed(2)),
            high: Number(h.toFixed(2)),
            low: Number(l.toFixed(2)),
            close: Number(c.toFixed(2)),
            volume: v
          });
        }
      }

      // 若 TWSE / TPEx OpenAPI 取得最新交易日資料，補齊或更新最新一根 K 線
      const lq = latestQuote.status === 'fulfilled' ? latestQuote.value : null;
      if (lq && lq.date) {
        barsMap.set(lq.date, {
          time: lq.date,
          open: Number(lq.open.toFixed(2)),
          high: Number(lq.high.toFixed(2)),
          low: Number(lq.low.toFixed(2)),
          close: Number(lq.close.toFixed(2)),
          volume: lq.volume
        });
        if (barsMap.size <= 5) {
          sourceLabel = lq.apiSource;
        }
      }

      const bars = Array.from(barsMap.values()).sort((a, b) => a.time.localeCompare(b.time));
      if (bars.length < 5) {
        throw new Error(`FinMind / TWSE 無足夠 ${stockCode} 歷史資料`);
      }

      const meta = metaRes.status === 'fulfilled' ? metaRes.value : { name: stockCode, market: 'TW' };
      const finalName = (lq && lq.name && lq.name !== stockCode) ? lq.name : (meta.name || stockCode);
      const marketSuffix = (lq && lq.market) ? lq.market : (meta.market || 'TW');
      const finalSymbol = `${stockCode}.${marketSuffix}`;

      const lastBar = bars[bars.length - 1];
      const prevBar = bars[bars.length - 2] || lastBar;
      const livePrice = (lq && Number.isFinite(lq.close) && lq.close > 0) ? Number(lq.close.toFixed(2)) : lastBar.close;

      return {
        symbol: finalSymbol,
        name: finalName,
        price: livePrice,
        prevClose: prevBar.close,
        bars,
        fetchedAt: Date.now(),
        source: 'LIVE',
        sourceLabel
      };
    }

    /* ------------------------------------------------------------------------
       4B. 多代理高可用閘道池：Yahoo Finance (query1 / query2) + Stooq CSV
       ------------------------------------------------------------------------ */
    function buildCorsProxyCandidates(targetUrl) {
      return [
        {
          type: 'ALLORIGINS_WRAP',
          url: `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`
        },
        {
          type: 'DIRECT_JSON',
          url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`
        },
        {
          type: 'DIRECT_JSON',
          url: `https://corsproxy.io/?url=${encodeURIComponent(targetUrl)}`
        },
        {
          type: 'DIRECT_JSON',
          url: `https://thingproxy.freeboard.io/fetch/${targetUrl}`
        }
      ];
    }

    async function fetchViaCorsGatewaysJson(targetUrl) {
      const candidates = buildCorsProxyCandidates(targetUrl);
      let lastErr = null;

      for (const cand of candidates) {
        try {
          const rawJson = await fetchJsonWithTimeout(cand.url, 5500);
          if (cand.type === 'ALLORIGINS_WRAP') {
            if (!rawJson || !rawJson.contents) throw new Error('AllOrigins contents 為空');
            return JSON.parse(rawJson.contents);
          }
          return rawJson;
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error('所有 CORS 代理閘道均無法取得回應');
    }

    async function fetchViaCorsGatewaysText(targetUrl) {
      const candidates = buildCorsProxyCandidates(targetUrl);
      let lastErr = null;

      for (const cand of candidates) {
        try {
          if (cand.type === 'ALLORIGINS_WRAP') {
            const rawJson = await fetchJsonWithTimeout(cand.url, 5500);
            if (!rawJson || !rawJson.contents) throw new Error('AllOrigins contents 為空');
            return String(rawJson.contents);
          }
          return await fetchTextWithTimeout(cand.url, 5500);
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error('所有 CORS 代理閘道均無法取得文字回應');
    }

    function parseYahooChartPayload(data, symbol) {
      const result = data && data.chart && data.chart.result && data.chart.result[0];
      if (!result || !result.timestamp || !result.indicators || !result.indicators.quote || !result.indicators.quote[0]) {
        throw new Error('Yahoo 回傳資料缺少 K 線欄位');
      }

      const ts = result.timestamp;
      const q = result.indicators.quote[0];
      const barsMap = new Map();

      for (let i = 0; i < ts.length; i++) {
        const o = q.open[i], h = q.high[i], l = q.low[i], c = q.close[i], v = q.volume[i];
        if (o == null || h == null || l == null || c == null || isNaN(c) || c <= 0) continue;
        const d = new Date(ts[i] * 1000);
        const dateStr = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
        barsMap.set(dateStr, {
          time: dateStr,
          open: Number(o.toFixed(2)),
          high: Number(h.toFixed(2)),
          low: Number(l.toFixed(2)),
          close: Number(c.toFixed(2)),
          volume: Math.max(0, Math.round(v || 0))
        });
      }

      const bars = Array.from(barsMap.values()).sort((a, b) => a.time.localeCompare(b.time));
      if (bars.length < 5) throw new Error('Yahoo K 線有效筆數不足');

      const meta = result.meta || {};
      const lastBar = bars[bars.length - 1];
      const prevBar = bars[bars.length - 2] || lastBar;
      const livePrice = Number((meta.regularMarketPrice || lastBar.close).toFixed(2));
      const prevClose = Number((meta.chartPreviousClose || prevBar.close).toFixed(2));

      return {
        symbol,
        name: meta.shortName || meta.longName || symbol,
        price: livePrice,
        prevClose,
        bars,
        fetchedAt: Date.now(),
        source: 'LIVE',
        sourceLabel: 'YAHOO'
      };
    }

    async function fetchYahooChartMultiHost(symbol) {
      const hosts = ['query1.finance.yahoo.com', 'query2.finance.yahoo.com'];
      let lastErr = null;
      for (const host of hosts) {
        const targetUrl = `https://${host}/v8/finance/chart/${encodeURIComponent(symbol)}?range=1y&interval=1d`;
        try {
          const payload = await fetchViaCorsGatewaysJson(targetUrl);
          return parseYahooChartPayload(payload, symbol);
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error('Yahoo Finance 抓取失敗');
    }

    /**
     * 美股第二層備援：Stooq 歷史日線 CSV (https://stooq.com/q/d/l/?s=nvda.us&i=d)
     */
    async function fetchStooqDailyCsv(symbol) {
      const cleanBase = symbol.replace(/[^A-Z0-9.-]/gi, '').toLowerCase();
      const stooqSym = cleanBase.includes('.') ? cleanBase : `${cleanBase}.us`;
      const stooqUrl = `https://stooq.com/q/d/l/?s=${encodeURIComponent(stooqSym)}&i=d`;

      const csvText = await fetchViaCorsGatewaysText(stooqUrl);
      const lines = csvText.trim().split(/\r?\n/);
      if (lines.length < 10 || !lines[0].toLowerCase().includes('date')) {
        throw new Error('Stooq CSV 格式無效或查無標的');
      }

      const bars = [];
      // 取最近 260 個交易日（約一年）
      const recentLines = lines.slice(-260);
      for (const line of recentLines) {
        const parts = line.split(',');
        if (parts.length < 5) continue;
        const [dateStr, oStr, hStr, lStr, cStr, vStr] = parts;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) continue;
        const o = parseFloat(oStr), h = parseFloat(hStr), l = parseFloat(lStr), c = parseFloat(cStr);
        const v = Math.max(0, Math.round(parseFloat(vStr) || 0));
        if (!Number.isFinite(c) || c <= 0) continue;
        bars.push({
          time: dateStr,
          open: Number((Number.isFinite(o) ? o : c).toFixed(2)),
          high: Number((Number.isFinite(h) ? h : c).toFixed(2)),
          low: Number((Number.isFinite(l) ? l : c).toFixed(2)),
          close: Number(c.toFixed(2)),
          volume: v
        });
      }

      if (bars.length < 5) throw new Error('Stooq 有效 K 線不足');
      bars.sort((a, b) => a.time.localeCompare(b.time));
      const last = bars[bars.length - 1];
      const prev = bars[bars.length - 2] || last;

      return {
        symbol,
        name: `${symbol} (Stooq)`,
        price: last.close,
        prevClose: prev.close,
        bars,
        fetchedAt: Date.now(),
        source: 'LIVE',
        sourceLabel: 'STOOQ'
      };
    }

    /**
     * 統一行情入口調度器：依市場別執行多層次連網抓取與降級保護
     */
    async function getMarketData(rawInput, forceRefresh = false) {
      const sym = normalizeSymbol(rawInput);
      if (!sym) throw new Error('請輸入有效的股票代號');

      const ttl = Number(appState.settings.cacheTtlMs);
      const cached = appState.marketCache[sym];

      // 0. 檢查本地快取是否仍在有效期限內
      if (!forceRefresh && cached && cached.bars && cached.bars.length > 0) {
        const age = Date.now() - (cached.fetchedAt || 0);
        if (ttl === 0 || age < ttl) {
          if (cached.source === 'OFFLINE') {
            updateStatusBadge('OFFLINE');
          } else {
            updateStatusBadge('CACHED', cached.sourceLabel || 'LOCAL');
          }
          return cached;
        }
      }

      updateStatusBadge('LOADING');

      // 路徑 A：台股與台股 ETF（優先免代理直連 FinMind + TWSE/TPEx，其次 Yahoo .TW / .TWO）
      if (isTaiwanSymbol(sym)) {
        try {
          const twData = await fetchTaiwanStockDirect(sym);
          appState.marketCache[sym] = twData;
          if (twData.symbol !== sym) {
            appState.marketCache[twData.symbol] = twData;
          }
          saveState();
          updateStatusBadge('LIVE', twData.sourceLabel || 'FINMIND');
          return twData;
        } catch (errDirect) {
          // 第二層：多代理 Yahoo Finance (.TW 與 .TWO)
          const code = extractTaiwanCode(sym);
          const candidates = sym.endsWith('.TWO') ? [`${code}.TWO`, `${code}.TW`] : [`${code}.TW`, `${code}.TWO`];
          for (const ySym of candidates) {
            try {
              const yData = await fetchYahooChartMultiHost(ySym);
              appState.marketCache[sym] = yData;
              appState.marketCache[ySym] = yData;
              saveState();
              updateStatusBadge('LIVE', 'YAHOO');
              return yData;
            } catch (_) {}
          }
        }
      } else {
        // 路徑 B：美股與全球標的（第一層 Yahoo 多代理池，第二層 Stooq CSV）
        try {
          const yData = await fetchYahooChartMultiHost(sym);
          appState.marketCache[sym] = yData;
          saveState();
          updateStatusBadge('LIVE', 'YAHOO');
          return yData;
        } catch (errYahoo) {
          try {
            const stooqData = await fetchStooqDailyCsv(sym);
            appState.marketCache[sym] = stooqData;
            saveState();
            updateStatusBadge('LIVE', 'STOOQ');
            return stooqData;
          } catch (_) {}
        }
      }

      // 降級保護 1：若有舊快取，優先使用舊快取而非假數據
      if (cached && cached.bars && cached.bars.length > 0 && cached.source !== 'OFFLINE') {
        updateStatusBadge('CACHED', cached.sourceLabel || 'LOCAL');
        showToast(`即時連線逾時，已載入 ${sym} 歷史快取報價`, 'warn');
        return cached;
      }

      // 降級保護 2：完全離線或無效代號時，退回確定性離線模擬
      const offlineData = generateOfflineDataset(sym);
      appState.marketCache[sym] = offlineData;
      saveState();
      updateStatusBadge('OFFLINE');
      showToast(`網路受限或查無此標的，${sym} 已啟用離線模擬行情`, 'warn');
      return offlineData;
    }

    function calculateOrderMetrics(side, price, shares, isEtf) {
      const s = appState.settings;
      const grossAmount = price * shares;
      const fee = shares > 0 && price > 0
        ? Math.max(s.minFee, Math.round(grossAmount * s.feeRate * s.discount))
        : 0;
      const taxRate = isEtf ? s.etfTaxRate : s.stockTaxRate;
      const tax = (side === 'SELL' && shares > 0 && price > 0)
        ? Math.round(grossAmount * taxRate)
        : 0;
      const netAmount = side === 'BUY' ? (grossAmount + fee) : (grossAmount - fee - tax);
      return { grossAmount, fee, tax, netAmount };
    }

    function calculateBreakEvenPrice(avgCost, shares, isEtf) {
      if (!Number.isFinite(avgCost) || avgCost <= 0 || !Number.isFinite(shares) || shares <= 0) return 0;
      const s = appState.settings;
      const effFeeRate = s.feeRate * s.discount;
      const taxRate = isEtf ? s.etfTaxRate : s.stockTaxRate;
      const denom = Math.max(0.01, 1 - effFeeRate - taxRate);
      const byRate = avgCost / denom;
      const byMinFee = (avgCost * shares + s.minFee) / (shares * Math.max(0.01, 1 - taxRate));
      return Math.max(byRate, byMinFee);
    }

    function getParsedOrderInput() {
      const sym = normalizeSymbol(document.getElementById('orderSymbol').value);
      const price = Number(document.getElementById('orderPrice').value);
      const rawQty = Number(document.getElementById('orderQty').value);
      const isEtf = document.getElementById('orderIsEtf').checked;

    function updateOrderPreview() {
      const { sym, price, rawQty, shares, isEtf } = getParsedOrderInput();
      const acc = getActiveAccount();
      const validNum = Number.isFinite(price) && price > 0 && Number.isFinite(shares) && shares > 0;
      const m = validNum ? calculateOrderMetrics(orderSide, price, shares, isEtf) : { grossAmount: 0, fee: 0, tax: 0, netAmount: 0 };

      document.getElementById('prevGross').textContent = `${fmtMoney(shares)} 股 / $${fmtMoney(m.grossAmount, 0)}`;
      document.getElementById('prevFeeTax').textContent = `費 $${fmtMoney(m.fee)} / 稅 $${fmtMoney(m.tax)}`;
      document.getElementById('prevNetLabel').textContent = orderSide === 'BUY' ? '預計扣款總額 (含費)' : '預計淨得款項 (扣費稅)';
      document.getElementById('prevNetAmount').textContent = `$${fmtMoney(m.netAmount, 0)}`;

      const msgEl = document.getElementById('orderValidationMsg');
      let errMsg = '';
      if (orderUnitMode === 'ODD' && Number.isFinite(rawQty) && rawQty > 0 && (rawQty > 999 || !Number.isInteger(rawQty))) {
        errMsg = '零股模式請輸入 1 ~ 999 之整數股數（若超過 1000 股請切換整股模式）';
      } else if (validNum && orderSide === 'BUY' && acc.cash < m.netAmount) {
        errMsg = `可用現金不足！目前現金 $${fmtMoney(acc.cash)}，短缺 $${fmtMoney(Math.ceil(m.netAmount - acc.cash))}`;
      } else if (validNum && orderSide === 'SELL') {
        const held = acc.holdings[sym] ? acc.holdings[sym].shares : 0;
        if (held < shares) {
          errMsg = `持股庫存不足！目前持有 ${sym || '該標的'} ${fmtMoney(held)} 股，無法賣出 ${fmtMoney(shares)} 股`;
        }
      }

      if (errMsg) {
        msgEl.textContent = '⚠ ' + errMsg;
        msgEl.classList.remove('hidden');
      } else {
        msgEl.classList.add('hidden');
      }
      return { valid: validNum && !errMsg && Boolean(sym), errMsg, metrics: m, sym, price, shares, isEtf };
    }

    function submitOrder() {
      const check = updateOrderPreview();
      if (!check.sym) {
        showToast('請輸入股票代號', 'error');
        return;
      }
      if (!Number.isFinite(check.price) || check.price <= 0) {
        showToast('請輸入大於 0 的有效單價', 'error');
        return;
      }
      if (!Number.isFinite(check.shares) || check.shares <= 0) {
        showToast('請輸入大於 0 的有效股數/張數', 'error');
        return;
      }
      if (!check.valid) {
        showToast(check.errMsg || '下單條件檢核未通過', 'error');
        return;
      }

      const acc = getActiveAccount();
      const { sym, price, shares, isEtf, metrics } = check;
      const rawReason = document.getElementById('orderReason').value;
      const reason = rawReason ? rawReason : '未填寫';
      const note = document.getElementById('orderNote').value.trim();
      const cached = appState.marketCache[sym];
      const stockName = cached ? cached.name : sym;

      if (!cached) {
        const offline = generateOfflineDataset(sym);
        offline.price = price;
        appState.marketCache[sym] = offline;
      }

      let realizedPnlThisTrade = null;

      if (orderSide === 'BUY') {
        acc.cash = Number((acc.cash - metrics.netAmount).toFixed(2));
        const existing = acc.holdings[sym];
        if (existing) {
          const newShares = existing.shares + shares;
          const newTotalCost = existing.totalCost + metrics.grossAmount + metrics.fee;
          existing.shares = newShares;
          existing.totalCost = newTotalCost;
          existing.avgCost = newTotalCost / newShares;
          existing.isEtf = isEtf;
          existing.name = stockName;
        } else {
          const totalCost = metrics.grossAmount + metrics.fee;
          acc.holdings[sym] = {
            symbol: sym,
            name: stockName,
            shares,
            totalCost,
            avgCost: totalCost / shares,
            isEtf
          };
        }
      } else {
        const existing = acc.holdings[sym];
        const costBasis = existing.avgCost * shares;
        realizedPnlThisTrade = metrics.netAmount - costBasis;
        acc.cash = Number((acc.cash + metrics.netAmount).toFixed(2));
        acc.realizedPnl = Number((acc.realizedPnl + realizedPnlThisTrade).toFixed(2));

        const remShares = existing.shares - shares;
        if (remShares <= 0) {
          delete acc.holdings[sym];
        } else {
          existing.shares = remShares;
          existing.totalCost = existing.avgCost * remShares;
        }
      }

      acc.trades.unshift({
        id: 'tr_' + Date.now(),
        time: new Date().toISOString(),
        side: orderSide,
        symbol: sym,
        name: stockName,
        price,
        shares,
        grossAmount: metrics.grossAmount,
        fee: metrics.fee,
        tax: metrics.tax,
        netAmount: metrics.netAmount,
        realizedPnl: realizedPnlThisTrade,
        reason,
        note
      });

      document.getElementById('orderNote').value = '';
      saveState();
      renderSimTab();
      updateOrderPreview();
      showToast(
        `${orderSide === 'BUY' ? '買進' : '賣出'}成交：${sym} ${fmtMoney(shares)} 股 @ ${fmtPrice(price)}`,
        'success'
      );
    }

    function computeAccountStats(acc) {
      let holdingsMarketValue = 0;
      let holdingsCostTotal = 0;
      const rows = [];

      Object.values(acc.holdings).forEach(h => {
        const cached = appState.marketCache[h.symbol];
        const curPrice = (cached && Number.isFinite(cached.price)) ? cached.price : h.avgCost;
        const marketVal = curPrice * h.shares;
        const unrealized = marketVal - h.totalCost;
        const unrealizedPct = h.totalCost > 0 ? (unrealized / h.totalCost) * 100 : 0;
        const breakEven = calculateBreakEvenPrice(h.avgCost, h.shares, h.isEtf);

        holdingsMarketValue += marketVal;
        holdingsCostTotal += h.totalCost;
        rows.push({ ...h, curPrice, marketVal, unrealized, unrealizedPct, breakEven });
      });

      const totalAssets = acc.cash + holdingsMarketValue;
      const totalPnl = totalAssets - acc.initialCapital;
      const totalRoi = acc.initialCapital > 0 ? (totalPnl / acc.initialCapital) * 100 : 0;
      const unrealizedTotal = holdingsMarketValue - holdingsCostTotal;
      const unrealizedPctTotal = holdingsCostTotal > 0 ? (unrealizedTotal / holdingsCostTotal) * 100 : 0;

      return {
        totalAssets,
        holdingsMarketValue,
        holdingsCostTotal,
        unrealizedTotal,
        unrealizedPctTotal,
        totalRoi,
        rows
      };
    }

    /* ========================================================================
       6. 分頁二：盤面分析 (週/月K 彙整、技術指標數學引擎、單一圖表渲染)
       ======================================================================== */
    function getIsoWeekKey(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      const dayNum = dt.getUTCDay() || 7;
      dt.setUTCDate(dt.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((dt - yearStart) / 86400000) + 1) / 7);
      return `${dt.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    }

    function aggregateBars(dailyBars, timeframe) {
      if (timeframe === '1D' || !dailyBars || dailyBars.length === 0) return dailyBars;
      const groups = new Map();
      for (const b of dailyBars) {
        const key = timeframe === '1W' ? getIsoWeekKey(b.time) : b.time.slice(0, 7);
        if (!groups.has(key)) {
          groups.set(key, {
            time: b.time,
            open: b.open,
            high: b.high,
            low: b.low,
            close: b.close,
            volume: b.volume
          });
        } else {
          const g = groups.get(key);
          g.time = b.time;
          g.high = Math.max(g.high, b.high);
          g.low = Math.min(g.low, b.low);
          g.close = b.close;
          g.volume += b.volume;
        }
      }
      return Array.from(groups.values());
    }

    function calcSMA(bars, period, key = 'close') {
      const out = [];
      let sum = 0;
      for (let i = 0; i < bars.length; i++) {
        sum += bars[i][key];
        if (i >= period) sum -= bars[i - period][key];
        if (i >= period - 1) {
          out.push({ time: bars[i].time, value: Number((sum / period).toFixed(2)) });
        }
      }
      return out;
    }

    function calcEMAValues(values, period) {
      const out = new Array(values.length).fill(null);
      if (values.length < period) return out;
      let sum = 0;
      for (let i = 0; i < period; i++) sum += values[i];
      let prev = sum / period;
      out[period - 1] = prev;
      const k = 2 / (period + 1);
      for (let i = period; i < values.length; i++) {
        prev = values[i] * k + prev * (1 - k);
        out[i] = prev;
      }
      return out;
    }

    function calcKD(bars, n = 9) {
      const kSeries = [];
      const dSeries = [];
      let prevK = 50;
      let prevD = 50;
      for (let i = 0; i < bars.length; i++) {
        const start = Math.max(0, i - n + 1);
        let highest = -Infinity, lowest = Infinity;
        for (let j = start; j <= i; j++) {
          if (bars[j].high > highest) highest = bars[j].high;
          if (bars[j].low < lowest) lowest = bars[j].low;
        }
        const denom = highest - lowest;
        const rsv = denom === 0 ? 50 : ((bars[i].close - lowest) / denom) * 100;
        const k = (2 / 3) * prevK + (1 / 3) * rsv;
        const d = (2 / 3) * prevD + (1 / 3) * k;
        prevK = k;
        prevD = d;
        if (i >= n - 1) {
          kSeries.push({ time: bars[i].time, value: Number(k.toFixed(2)) });
          dSeries.push({ time: bars[i].time, value: Number(d.toFixed(2)) });
        }
      }
      return { kSeries, dSeries };
    }

    function calcRSI(bars, period = 14) {
      const out = [];
      if (bars.length <= period) return out;
      let gainSum = 0, lossSum = 0;
      for (let i = 1; i <= period; i++) {
        const diff = bars[i].close - bars[i - 1].close;
        if (diff >= 0) gainSum += diff;
        else lossSum += Math.abs(diff);
      }
      let avgGain = gainSum / period;
      let avgLoss = lossSum / period;

      const pushVal = (idx, g, l) => {
        const rsi = l === 0 ? (g === 0 ? 50 : 100) : 100 - (100 / (1 + g / l));
        out.push({ time: bars[idx].time, value: Number(rsi.toFixed(2)) });
      };
      pushVal(period, avgGain, avgLoss);

      for (let i = period + 1; i < bars.length; i++) {
        const diff = bars[i].close - bars[i - 1].close;
        const gain = diff > 0 ? diff : 0;
        const loss = diff < 0 ? Math.abs(diff) : 0;
        avgGain = (avgGain * (period - 1) + gain) / period;
        avgLoss = (avgLoss * (period - 1) + loss) / period;
        pushVal(i, avgGain, avgLoss);
      }
      return out;
    }

    function calcMACD(bars, fast = 12, slow = 26, signal = 9) {
      const closes = bars.map(b => b.close);
      const emaFast = calcEMAValues(closes, fast);
      const emaSlow = calcEMAValues(closes, slow);
      const difRaw = [];
      const difTimes = [];

      for (let i = 0; i < bars.length; i++) {
        if (emaFast[i] !== null && emaSlow[i] !== null) {
          difRaw.push(emaFast[i] - emaSlow[i]);
          difTimes.push(bars[i].time);
        }
      }
      const sigRaw = calcEMAValues(difRaw, signal);
      const difSeries = [], macdSeries = [], oscSeries = [];
      const colors = getThemeColors();

      for (let i = 0; i < difRaw.length; i++) {
        if (sigRaw[i] !== null) {
          const difVal = Number(difRaw[i].toFixed(2));
          const sigVal = Number(sigRaw[i].toFixed(2));
          const oscVal = Number((difVal - sigVal).toFixed(2));
          difSeries.push({ time: difTimes[i], value: difVal });
          macdSeries.push({ time: difTimes[i], value: sigVal });
          oscSeries.push({
            time: difTimes[i],
            value: oscVal,
            color: oscVal >= 0 ? colors.up : colors.down
          });
        }
      }
      return { difSeries, macdSeries, oscSeries };
    }

    function destroyActiveChart() {
      if (lwcResizeObserver) {
        lwcResizeObserver.disconnect();
        lwcResizeObserver = null;
      }
      if (lwcChart) {
        lwcChart.remove();
        lwcChart = null;
      }
      document.getElementById('chartViewport').innerHTML = '';
    }

    async function loadChartSymbol(symbol, forceRefresh = false) {
      const sym = normalizeSymbol(symbol);
      if (!sym) return;
      appState.activeChartSymbol = sym;
      document.getElementById('chartSymbolInput').value = sym;
      saveState();
      renderWatchlistChips();

      try {
        currentChartData = await getMarketData(sym, forceRefresh);
        if (currentChartData.symbol && currentChartData.symbol !== sym) {
          appState.activeChartSymbol = currentChartData.symbol;
          document.getElementById('chartSymbolInput').value = currentChartData.symbol;
          saveState();
          renderWatchlistChips();
        }
        updateChartHeader();
        renderActiveChart();
      } catch (e) {
        showToast('載入圖表失敗：' + e.message, 'error');
      }
    }

    function loadChartSymbolFromInput() {
      const val = document.getElementById('chartSymbolInput').value.trim();
      if (!val) {
        showToast('請輸入股票代號', 'error');
        return;
      }
      loadChartSymbol(val, false);
    }

    function jumpToChart(symbol) {
      switchMainTab('chart');
      loadChartSymbol(symbol, false);
    }

    function setChartTimeframe(tf) {
      appState.activeTimeframe = tf;
      saveState();
      updateChartControlsUI();
      renderActiveChart();
    }

    function setChartMode(mode) {
      appState.activeChartMode = mode;
      saveState();
      updateChartControlsUI();
      renderActiveChart();
    }

    function updateChartHeader() {
      if (!currentChartData) return;
      const d = currentChartData;
      const diff = d.price - d.prevClose;
      const pct = d.prevClose > 0 ? (diff / d.prevClose) * 100 : 0;

      document.getElementById('chartHeaderSymbol').textContent = d.symbol;
      document.getElementById('chartHeaderName').textContent = d.name;
      document.getElementById('chartSourceTag').textContent =
        d.source === 'LIVE' ? `即時源：${d.sourceLabel || 'LIVE'}` : '離線模擬數據';

      const pEl = document.getElementById('chartHeaderPrice');
      pEl.textContent = fmtPrice(d.price);
      pEl.className = `text-[18px] font-bold mono ${getPnlClass(diff)}`;

      const cEl = document.getElementById('chartHeaderChange');
      cEl.textContent = `${diff >= 0 ? '+' : ''}${diff.toFixed(2)} (${fmtSignedPct(pct)})`;
      cEl.className = `text-[12px] mono ml-1.5 ${getPnlClass(diff)}`;
    }

    function updateChartControlsUI() {
      document.querySelectorAll('.tf-btn').forEach(btn => {
        const active = btn.dataset.tf === appState.activeTimeframe;
        btn.className = active
          ? 'tf-btn btn-term px-3 py-1 text-[12px] font-bold mono border border-[#FF9900] text-black bg-[#FF9900]'
          : 'tf-btn btn-term px-3 py-1 text-[12px] font-semibold mono border border-[#262E3D] text-[#8B95A5] bg-[#0A0C0F]';
      });

      document.querySelectorAll('.mode-btn').forEach(btn => {
        const active = btn.dataset.mode === appState.activeChartMode;
        btn.className = active
          ? 'mode-btn btn-term py-1.5 text-[11px] font-bold border border-[#FF9900] text-[#FF9900] bg-[rgba(255,153,0,0.14)] text-center'
          : 'mode-btn btn-term py-1.5 text-[11px] font-semibold border border-[#262E3D] text-[#8B95A5] bg-[#0A0C0F] text-center';
      });

      const maRow = document.getElementById('maToggleRow');
      if (appState.activeChartMode === 'CANDLE_MA') {
        maRow.classList.remove('hidden');
      } else {
        maRow.classList.add('hidden');
      }

      const periods = appState.settings.maPeriods;
      document.getElementById('labelMa0').textContent = `MA${periods[0]}`;
      document.getElementById('labelMa1').textContent = `MA${periods[1]}`;
      document.getElementById('labelMa2').textContent = `MA${periods[2]}`;

      document.getElementById('guideContent').textContent = guide.text;

    function toggleGuideBox() {
      appState.guideExpanded = !appState.guideExpanded;
      saveState();
      updateChartControlsUI();
    }

    function renderWatchlistChips() {
      const container = document.getElementById('watchlistChips');
      container.innerHTML = appState.settings.watchlist.map(sym => {
        const active = sym === appState.activeChartSymbol;
        return `<button onclick="loadChartSymbol('${escapeHtml(sym)}')" class="btn-term px-2.5 py-1 text-[11px] mono font-semibold shrink-0 border ${
          active ? 'border-[#FF9900] text-[#FF9900] bg-[rgba(255,153,0,0.14)]' : 'border-[#262E3D] text-[#D1D5DB] bg-[#0A0C0F]'
        }">${escapeHtml(sym)}</button>`;
      }).join('');
    }

    function renderActiveChart() {
      if (!currentChartData || !currentChartData.bars || currentChartData.bars.length === 0) return;
      destroyActiveChart();

      const bars = aggregateBars(currentChartData.bars, appState.activeTimeframe);
      const viewport = document.getElementById('chartViewport');
      const mode = appState.activeChartMode;
      const colors = getThemeColors();

      if (typeof window.LightweightCharts === 'undefined' || !window.LightweightCharts.createChart) {
        document.getElementById('chartEngineTag').textContent = 'CANVAS 2D';
        renderFallbackCanvasChart(viewport, bars, mode, colors);
        return;
      }

      document.getElementById('chartEngineTag').textContent = 'LWC v4';
      const chart = window.LightweightCharts.createChart(viewport, {
        width: viewport.clientWidth || 340,
        height: viewport.clientHeight || 340,
        layout: {
          background: { type: 'solid', color: colors.bg },
          textColor: colors.text,
          fontFamily: "'JetBrains Mono', monospace",
          fontSize: 11
        },
        grid: {
          vertLines: { color: colors.grid },
          horzLines: { color: colors.grid }
        },
        crosshair: {
          mode: window.LightweightCharts.CrosshairMode.Normal,
          vertLine: { color: '#FF9900', width: 1, style: 2, labelBackgroundColor: '#FF9900' },
          horzLine: { color: '#FF9900', width: 1, style: 2, labelBackgroundColor: '#FF9900' }
        },
        rightPriceScale: { borderColor: '#262E3D' },
        timeScale: { borderColor: '#262E3D', timeVisible: false }
      });

      lwcChart = chart;
      const seriesRefs = {};

      if (mode === 'CANDLE_MA') {
        const candle = chart.addCandlestickSeries({
          upColor: colors.up,
          downColor: colors.down,
          borderUpColor: colors.up,
          borderDownColor: colors.down,
          wickUpColor: colors.up,
          wickDownColor: colors.down
        });
        candle.setData(bars.map(b => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close })));
        seriesRefs.candle = candle;

        const maColors = ['#F59E0B', '#38BDF8', '#C084FC'];
        appState.settings.maPeriods.forEach((p, idx) => {
          const checked = document.getElementById(`toggleMa${idx}`).checked;
          if (checked && bars.length >= p) {
            const line = chart.addLineSeries({
              color: maColors[idx],
              lineWidth: 1.5,
              priceLineVisible: false,
              lastValueVisible: false
            });
            line.setData(calcSMA(bars, p, 'close'));
            seriesRefs[`ma${idx}`] = { series: line, period: p, color: maColors[idx] };
          }
        });
      } else if (mode === 'VOL') {
        const volSeries = chart.addHistogramSeries({ priceFormat: { type: 'volume' } });
        volSeries.setData(bars.map(b => ({
          time: b.time,
          value: b.volume,
          color: b.close >= b.open ? colors.up : colors.down
        })));
        seriesRefs.vol = volSeries;

        const vma5 = chart.addLineSeries({ color: '#F59E0B', lineWidth: 1.5, priceLineVisible: false });
        vma5.setData(calcSMA(bars, 5, 'volume'));
        seriesRefs.vma5 = vma5;

        const vma20 = chart.addLineSeries({ color: '#38BDF8', lineWidth: 1.5, priceLineVisible: false });
        vma20.setData(calcSMA(bars, 20, 'volume'));
        seriesRefs.vma20 = vma20;
      } else if (mode === 'KD') {
        const { kSeries, dSeries } = calcKD(bars, 9);
        const kLine = chart.addLineSeries({ color: '#FF9900', lineWidth: 2, title: '%K' });
        const dLine = chart.addLineSeries({ color: '#38BDF8', lineWidth: 1.5, title: '%D' });
        kLine.setData(kSeries);
        dLine.setData(dSeries);
        kLine.createPriceLine({ price: 80, color: '#FF3B30', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '80 超買' });
        kLine.createPriceLine({ price: 20, color: '#00C853', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '20 超賣' });
        seriesRefs.k = kLine;
        seriesRefs.d = dLine;
      } else if (mode === 'RSI') {
        const rsiData = calcRSI(bars, 14);
        const rsiLine = chart.addLineSeries({ color: '#C084FC', lineWidth: 2, title: 'RSI(14)' });
        rsiLine.setData(rsiData);
        rsiLine.createPriceLine({ price: 70, color: '#FF3B30', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '70' });
        rsiLine.createPriceLine({ price: 30, color: '#00C853', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '30' });
        seriesRefs.rsi = rsiLine;
      } else if (mode === 'MACD') {
        const { difSeries, macdSeries, oscSeries } = calcMACD(bars, 12, 26, 9);
        const oscHist = chart.addHistogramSeries({ priceLineVisible: false });
        const difLine = chart.addLineSeries({ color: '#FF9900', lineWidth: 1.8, title: 'DIF' });
        const sigLine = chart.addLineSeries({ color: '#38BDF8', lineWidth: 1.5, title: 'MACD' });
        oscHist.setData(oscSeries);
        difLine.setData(difSeries);
        sigLine.setData(macdSeries);
        seriesRefs.dif = difLine;
        seriesRefs.sig = sigLine;
        seriesRefs.osc = oscHist;
      }

      chart.timeScale().fitContent();
      updateCrosshairReadoutFromLast(bars, mode);

      chart.subscribeCrosshairMove(param => {
        if (!param || !param.time) {
          updateCrosshairReadoutFromLast(bars, mode);
          return;
        }
        const barEl = document.getElementById('chartCrosshairBar');
        const dateStr = String(param.time);
        if (mode === 'CANDLE_MA' && seriesRefs.candle) {
          const c = param.seriesData.get(seriesRefs.candle);
          if (!c) return;
          let maHtml = '';
          [0, 1, 2].forEach(idx => {
            const ref = seriesRefs[`ma${idx}`];
            if (ref) {
              const v = param.seriesData.get(ref.series);
              if (v && v.value != null) {
                maHtml += `<span style="color:${ref.color}">MA${ref.period}:${v.value.toFixed(2)}</span>`;
              }
            }
          });
          barEl.innerHTML = `<span class="text-[#FF9900]">${dateStr}</span>
            <span>開:${c.open}</span><span>高:${c.high}</span><span>低:${c.low}</span><span>收:${c.close}</span>${maHtml}`;
        } else if (mode === 'VOL' && seriesRefs.vol) {
          const v = param.seriesData.get(seriesRefs.vol);
          const m5 = param.seriesData.get(seriesRefs.vma5);
          const m20 = param.seriesData.get(seriesRefs.vma20);
          if (!v) return;
          barEl.innerHTML = `<span class="text-[#FF9900]">${dateStr}</span>
            <span>量:${fmtMoney(v.value)}</span>
            ${m5 ? `<span class="text-[#F59E0B]">VMA5:${fmtMoney(Math.round(m5.value))}</span>` : ''}
            ${m20 ? `<span class="text-[#38BDF8]">VMA20:${fmtMoney(Math.round(m20.value))}</span>` : ''}`;
        } else if (mode === 'KD' && seriesRefs.k) {
          const kv = param.seriesData.get(seriesRefs.k);
          const dv = param.seriesData.get(seriesRefs.d);
          if (!kv) return;
          barEl.innerHTML = `<span class="text-[#FF9900]">${dateStr}</span>
            <span class="text-[#FF9900]">%K:${kv.value.toFixed(2)}</span>
            ${dv ? `<span class="text-[#38BDF8]">%D:${dv.value.toFixed(2)}</span>` : ''}`;
        } else if (mode === 'RSI' && seriesRefs.rsi) {
          const rv = param.seriesData.get(seriesRefs.rsi);
          if (!rv) return;
          barEl.innerHTML = `<span class="text-[#FF9900]">${dateStr}</span>
            <span class="text-[#C084FC]">RSI(14):${rv.value.toFixed(2)}</span>`;
        } else if (mode === 'MACD' && seriesRefs.dif) {
          const df = param.seriesData.get(seriesRefs.dif);
          const sg = param.seriesData.get(seriesRefs.sig);
          const os = param.seriesData.get(seriesRefs.osc);
          if (!df) return;
          barEl.innerHTML = `<span class="text-[#FF9900]">${dateStr}</span>
            <span class="text-[#FF9900]">DIF:${df.value.toFixed(2)}</span>
            ${sg ? `<span class="text-[#38BDF8]">MACD:${sg.value.toFixed(2)}</span>` : ''}
            ${os ? `<span>OSC:${os.value.toFixed(2)}</span>` : ''}`;
        }
      });

      lwcResizeObserver = new ResizeObserver(entries => {
        if (!lwcChart || !entries[0]) return;
        const { width, height } = entries[0].contentRect;
        if (width > 0 && height > 0) {
          lwcChart.applyOptions({ width, height });
        }
      });
      lwcResizeObserver.observe(viewport);
    }

    function updateCrosshairReadoutFromLast(bars, mode) {
      const barEl = document.getElementById('chartCrosshairBar');
      const last = bars[bars.length - 1];
      if (!last) return;
      if (mode === 'CANDLE_MA') {
        barEl.innerHTML = `<span class="text-[#FF9900]">${last.time}</span><span>開:${last.open}</span><span>高:${last.high}</span><span>低:${last.low}</span><span>收:${last.close}</span>`;
      } else if (mode === 'VOL') {
        barEl.innerHTML = `<span class="text-[#FF9900]">${last.time}</span><span>成交量:${fmtMoney(last.volume)}</span>`;
      } else if (mode === 'KD') {
        const { kSeries, dSeries } = calcKD(bars, 9);
        const lk = kSeries[kSeries.length - 1], ld = dSeries[dSeries.length - 1];
        barEl.innerHTML = lk ? `<span class="text-[#FF9900]">${lk.time}</span><span class="text-[#FF9900]">%K:${lk.value}</span><span class="text-[#38BDF8]">%D:${ld.value}</span>` : '資料筆數不足';
      } else if (mode === 'RSI') {
        const r = calcRSI(bars, 14);
        const lr = r[r.length - 1];
        barEl.innerHTML = lr ? `<span class="text-[#FF9900]">${lr.time}</span><span class="text-[#C084FC]">RSI(14):${lr.value}</span>` : '資料筆數不足';
      } else if (mode === 'MACD') {
        const { difSeries, macdSeries, oscSeries } = calcMACD(bars, 12, 26, 9);
        const ld = difSeries[difSeries.length - 1], ls = macdSeries[macdSeries.length - 1], lo = oscSeries[oscSeries.length - 1];
        barEl.innerHTML = ld ? `<span class="text-[#FF9900]">${ld.time}</span><span class="text-[#FF9900]">DIF:${ld.value}</span><span class="text-[#38BDF8]">MACD:${ls.value}</span><span>OSC:${lo.value}</span>` : '資料筆數不足';
      }
    }

    function renderFallbackCanvasChart(viewport, bars, mode, colors) {
      const canvas = document.createElement('canvas');
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      canvas.style.display = 'block';
      viewport.appendChild(canvas);

      const slice = bars.slice(-65);
      const dpr = window.devicePixelRatio || 1;
      const w = viewport.clientWidth || 340;
      const h = viewport.clientHeight || 340;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      const pad = { top: 18, right: 54, bottom: 24, left: 8 };
      const cw = w - pad.left - pad.right;
      const ch = h - pad.top - pad.bottom;

      ctx.fillStyle = colors.bg;
      ctx.fillRect(0, 0, w, h);

      const drawGrid = (minV, maxV) => {
        ctx.strokeStyle = colors.grid;
        ctx.lineWidth = 1;
        ctx.fillStyle = colors.text;
        ctx.font = '10px JetBrains Mono, monospace';
        for (let i = 0; i <= 4; i++) {
          const y = pad.top + (ch * i) / 4;
          const val = maxV - ((maxV - minV) * i) / 4;
          ctx.beginPath();
          ctx.moveTo(pad.left, y);
          ctx.lineTo(w - pad.right, y);
          ctx.stroke();
          ctx.fillText(val >= 10000 ? (val / 1000).toFixed(0) + 'K' : val.toFixed(1), w - pad.right + 4, y + 3);
        }
      };

      const xFor = i => pad.left + ((i + 0.5) / Math.max(1, slice.length)) * cw;

      if (mode === 'CANDLE_MA') {
        let minP = Infinity, maxP = -Infinity;
        slice.forEach(b => { minP = Math.min(minP, b.low); maxP = Math.max(maxP, b.high); });
        const span = Math.max(0.01, maxP - minP);
        minP -= span * 0.06; maxP += span * 0.06;
        const yFor = p => pad.top + ((maxP - p) / (maxP - minP)) * ch;
        drawGrid(minP, maxP);

        const barW = Math.max(2, (cw / slice.length) * 0.65);
        slice.forEach((b, i) => {
          const x = xFor(i);
          const col = b.close >= b.open ? colors.up : colors.down;
          ctx.strokeStyle = col;
          ctx.fillStyle = col;
          ctx.beginPath();
          ctx.moveTo(x, yFor(b.high));
          ctx.lineTo(x, yFor(b.low));
          ctx.stroke();
          const topY = yFor(Math.max(b.open, b.close));
          const botY = yFor(Math.min(b.open, b.close));
          ctx.fillRect(x - barW / 2, topY, barW, Math.max(1.5, botY - topY));
        });
      } else if (mode === 'VOL') {
        let maxV = 1;
        slice.forEach(b => { maxV = Math.max(maxV, b.volume); });
        drawGrid(0, maxV);
        const barW = Math.max(2, (cw / slice.length) * 0.65);
        slice.forEach((b, i) => {
          const x = xFor(i);
          const hBar = (b.volume / maxV) * ch;
          ctx.fillStyle = b.close >= b.open ? colors.up : colors.down;
          ctx.fillRect(x - barW / 2, pad.top + ch - hBar, barW, hBar);
        });
      } else if (mode === 'KD' || mode === 'RSI') {
        drawGrid(0, 100);
        const yFor = v => pad.top + ((100 - v) / 100) * ch;
        const drawLine = (pts, col) => {
          ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.beginPath();
          pts.forEach((p, idx) => {
            const x = pad.left + (idx / Math.max(1, pts.length - 1)) * cw;
            if (idx === 0) ctx.moveTo(x, yFor(p.value));
            else ctx.lineTo(x, yFor(p.value));
          });
          ctx.stroke();
        };
        if (mode === 'KD') {
          const { kSeries, dSeries } = calcKD(bars, 9);
          drawLine(kSeries.slice(-65), '#FF9900');
          drawLine(dSeries.slice(-65), '#38BDF8');
        } else {
          drawLine(calcRSI(bars, 14).slice(-65), '#C084FC');
        }
      } else if (mode === 'MACD') {
        const { difSeries, macdSeries, oscSeries } = calcMACD(bars, 12, 26, 9);
        const dSub = difSeries.slice(-65), mSub = macdSeries.slice(-65), oSub = oscSeries.slice(-65);
        let maxAbs = 0.1;
        [...dSub, ...mSub, ...oSub].forEach(p => { maxAbs = Math.max(maxAbs, Math.abs(p.value)); });
        drawGrid(-maxAbs, maxAbs);
        const yFor = v => pad.top + ((maxAbs - v) / (2 * maxAbs)) * ch;
        const zeroY = yFor(0);
        const barW = Math.max(2, (cw / Math.max(1, oSub.length)) * 0.6);
        oSub.forEach((p, i) => {
          const x = pad.left + ((i + 0.5) / Math.max(1, oSub.length)) * cw;
          ctx.fillStyle = p.color;
          const y = yFor(p.value);
          ctx.fillRect(x - barW / 2, Math.min(zeroY, y), barW, Math.abs(y - zeroY));
        });
      }

      updateCrosshairReadoutFromLast(bars, mode);
    }

       7. 分頁切換、設定 Modal 與 JSON 備份還原

    function switchMainTab(tab) {
      appState.activeTab = tab;
      saveState();

      const simSec = document.getElementById('tab-sim');
      const chartSec = document.getElementById('tab-chart');
      const btnSim = document.getElementById('navBtnSim');
      const btnChart = document.getElementById('navBtnChart');

      if (tab === 'sim') {
        simSec.classList.remove('hidden');
        chartSec.classList.add('hidden');
        btnSim.className = 'flex items-center justify-center border-t-2 border-[#FF9900] text-[#FF9900] bg-[rgba(255,153,0,0.06)]';
        btnChart.className = 'flex items-center justify-center border-t-2 border-transparent text-[#8B95A5]';
        renderSimTab();
      } else {
        simSec.classList.add('hidden');
        chartSec.classList.remove('hidden');
        btnChart.className = 'flex items-center justify-center border-t-2 border-[#FF9900] text-[#FF9900] bg-[rgba(255,153,0,0.06)]';
        btnSim.className = 'flex items-center justify-center border-t-2 border-transparent text-[#8B95A5]';
        updateChartControlsUI();
        renderWatchlistChips();
        if (!currentChartData || currentChartData.symbol !== appState.activeChartSymbol) {
          loadChartSymbol(appState.activeChartSymbol, false);
        } else {
          renderActiveChart();
        }
      }
    }

    async function forceRefreshCurrentContext() {
      if (appState.activeTab === 'chart') {
        await loadChartSymbol(appState.activeChartSymbol, true);
        showToast(`已強制重新抓取 ${appState.activeChartSymbol} 行情`, 'success');
      } else {
        const orderSym = document.getElementById('orderSymbol').value.trim();
        if (orderSym) {
          const data = await getMarketData(orderSym, true);
          document.getElementById('orderPrice').value = data.price;
          document.getElementById('orderQuoteName').textContent = `${data.symbol} ${data.name}`;
          updateOrderPreview();
        }
        await refreshAccountHoldingsPrices();
      }
    }

      const s = appState.settings;
      document.getElementById('setFeeRate').value = s.feeRate;
      document.getElementById('setDiscount').value = s.discount;
      document.getElementById('setMinFee').value = s.minFee;
      document.getElementById('setStockTax').value = s.stockTaxRate;
      document.getElementById('setEtfTax').value = s.etfTaxRate;
      document.getElementById('setMa0').value = s.maPeriods[0];
      document.getElementById('setMa1').value = s.maPeriods[1];
      document.getElementById('setMa2').value = s.maPeriods[2];
